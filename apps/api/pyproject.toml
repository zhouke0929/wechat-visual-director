[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-visual-director-api"
version = "0.1.0"
description = "Local-first visual director for WeChat Official Account articles"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "Pillow>=11.0,<12.0",
  "python-multipart>=0.0.9,<1.0",
  "PyYAML>=6.0,<7.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
visual-director = "visual_director.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
