name: cross-platform-ci

on:
  push:
    branches: [main, "codex/release-*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API test dependencies
        run: python -m pip install -e "apps/api[dev]"
      - name: Verify static theme showcase is current
        id: gallery
        # The published snapshot is canonical Windows output. macOS still
        # verifies all themes in the API tests, but Pillow can round a small
        # number of stroke-edge pixels differently there.
        if: runner.os == 'Windows'
        run: python scripts/export_theme_gallery.py --check --diagnostic-output gallery-ci-diagnostic.json
      - name: Upload gallery mismatch for inspection
        if: failure() && steps.gallery.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gallery-diagnostic-${{ matrix.os }}
          path: gallery-ci-diagnostic.json
          retention-days: 3
      - name: Reproduce native baseline from the pinned release
        if: runner.os == 'macOS'
        run: |
          git fetch --depth=1 origin 10e5661afbe39e9999c7e8a3b5ca943f67c12ba5
          python apps/api/tests/test_renderer_catalog_parity.py --platform-overlay
          git diff --exit-code -- apps/api/tests/fixtures/catalog-v1.0.0-darwin.json
      - name: Run API tests
        run: python -m pytest apps/api/tests -q
      - name: Build static workbench
        run: |
          corepack pnpm@11.7.0 --dir apps/web install --frozen-lockfile
          corepack pnpm@11.7.0 --dir apps/web build
      - name: Validate macOS shell scripts
        if: runner.os == 'macOS'
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-release.sh
          bash -n scripts/uninstall.sh
          bash -n scripts/bootstrap.sh
          bash -n scripts/build-macos-package.sh
          bash -n scripts/test-macos-package.sh
          bash -n scripts/persistent-launcher.sh
          bash -n scripts/visual-director.sh
          bash -n skills/wechat-visual-director/scripts/ensure-workbench.sh
      - name: macOS isolated install smoke test
        if: runner.os == 'macOS'
        run: |
          INSTALL_ROOT="$RUNNER_TEMP/wechat-visual-director"
          HOST_HOME="$RUNNER_TEMP/host-home"
          bash scripts/install.sh --install-root "$INSTALL_ROOT" --host-home "$HOST_HOME"
          "$INSTALL_ROOT/visual-director" serve --json
          "$INSTALL_ROOT/visual-director" doctor --json
          "$INSTALL_ROOT/visual-director" stop --json
          "$INSTALL_ROOT/uninstall.sh" --install-root "$INSTALL_ROOT" --host-home "$HOST_HOME"
      - name: Windows script contract tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pytest apps/api/tests/test_install_scripts.py -q
