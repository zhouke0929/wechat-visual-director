name: build-release-assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Activate pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Build Windows x64 portable package
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-package.ps1
      - name: Smoke test packaged install without system Python
        shell: pwsh
        run: |
          $asset = Get-ChildItem artifacts/release/wechat-visual-director-windows-x64-*.zip | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-package.ps1 -ArchivePath $asset.FullName
      - name: Verify old release upgrade and cross-host shared history
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "shared-history-release-check"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $oldName = "wechat-visual-director-windows-x64-v0.1.0-alpha.31.zip"
          $base = "https://github.com/zhouke0929/wechat-visual-director/releases/download/v0.1.0-alpha.31"
          Invoke-WebRequest "$base/$oldName" -OutFile (Join-Path $root $oldName)
          Invoke-WebRequest "$base/$oldName.sha256" -OutFile (Join-Path $root "$oldName.sha256")
          $asset = Get-ChildItem artifacts/release/wechat-visual-director-windows-x64-*.zip | Select-Object -First 1
          $harness = Join-Path $root "harness"
          Expand-Archive -LiteralPath $asset.FullName -DestinationPath $harness
          $python = Join-Path $harness "wechat-visual-director/runtime/python/python.exe"
          & $python scripts/test-windows-shared-history.py --old-archive (Join-Path $root $oldName) --new-archive $asset.FullName --root (Join-Path $root "cases") --port 18931
          if ($LASTEXITCODE -ne 0) { throw "Packaged shared history verification failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-visual-director-windows-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error

  macos-portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Verify runner architecture
        run: |
          case "${{ matrix.architecture }}:$(uname -m)" in
            arm64:arm64|x64:x86_64) ;;
            *) echo "Unexpected runner architecture: $(uname -m)" >&2; exit 2 ;;
          esac
      - name: Build macOS self-contained package
        run: bash scripts/build-macos-package.sh
      - name: Smoke test packaged install without system Python
        run: |
          asset="$(find artifacts/release -maxdepth 1 -name 'wechat-visual-director-macos-${{ matrix.architecture }}-*.tar.gz' -print -quit)"
          bash scripts/test-macos-package.sh --archive-path "$asset"
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-visual-director-macos-${{ matrix.architecture }}
          path: |
            artifacts/release/*.tar.gz
            artifacts/release/*.sha256
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag'
    needs: [windows-portable, macos-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wechat-visual-director-*
          path: artifacts/release
          merge-multiple: true
      - name: Publish verified cross-platform prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            artifacts/release/*.zip
            artifacts/release/*.tar.gz
            artifacts/release/*.sha256
            scripts/install-release.ps1
            scripts/install-release.sh
